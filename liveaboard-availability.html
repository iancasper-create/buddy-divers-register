<!DOCTYPE html>
<!-- BD-LBAVAIL 2026-07-26g | Itinerary prose split into liveaboard-itineraries.json, fetched on first use -->
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Liveaboard Finder | Buddy-Divers</title>
<link rel="icon" type="image/jpeg" href="https://res.cloudinary.com/dccbsfte0/image/upload/v1774016253/logo2_swvqfe.jpg" />
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&family=Raleway:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --teal:#007289; --teal2:#009495; --orange:#F5A623; --navy:#1B4F8A;
  --dark:#0d2a3a; --card:rgba(255,255,255,0.97); --light:#f0f7f9;
  --border:#c5dfe6; --text:#1a3a4a; --muted:#5a7a8a; --white:#fff;
  --ok:#2e9e6b; --mid:#e8a33d; --low:#e05555; --none:#9bb3bd;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Heebo',sans-serif;background:var(--dark);color:var(--text);min-height:100vh;direction:rtl}
body::before{content:'';position:fixed;inset:0;z-index:0;background:
  radial-gradient(ellipse at 20% 50%,rgba(0,148,149,0.18) 0%,transparent 60%),
  radial-gradient(ellipse at 80% 20%,rgba(27,79,138,0.22) 0%,transparent 50%),
  linear-gradient(160deg,#0a1f2e 0%,#0d2d3e 40%,#0a2535 100%)}
.wrap{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:26px 14px 70px}

.header{text-align:center;padding:22px 16px 26px}
.header h1{font-family:'Raleway',sans-serif;font-size:clamp(30px,5vw,52px);font-weight:800;
  color:#fff;letter-spacing:-1px;direction:ltr}
.header h1 span{color:var(--orange)}
.header p{color:#bcd7e0;margin-top:10px;font-size:clamp(15px,2vw,19px);font-weight:300}
.stamp{margin-top:16px;display:inline-flex;gap:16px;flex-wrap:wrap;justify-content:center;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:8px 20px}
.stamp b{color:var(--orange);font-weight:700}
.stamp span{color:#cfe3ea;font-size:13.5px}

.panel{background:var(--card);border-radius:16px;padding:18px;margin-bottom:16px;
  box-shadow:0 10px 34px rgba(0,0,0,.28)}
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:12px;font-weight:600;color:var(--muted)}
.fld select,.fld input[type=text]{font-family:inherit;font-size:14px;padding:9px 11px;
  border:1.5px solid var(--border);border-radius:9px;background:#fff;color:var(--text);min-width:150px}
.fld select:focus,.fld input:focus{outline:none;border-color:var(--teal2)}
.fld.wide select{min-width:215px;font-weight:600}
.tog{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;color:var(--text);
  cursor:pointer;padding-bottom:9px;white-space:nowrap}
.tog input{width:17px;height:17px;accent-color:var(--teal);cursor:pointer}
.tog.deal{color:#b26a00}
.tog.deal input{accent-color:var(--orange)}
.btn{font-family:inherit;font-size:14px;font-weight:600;padding:9px 16px;border-radius:9px;
  cursor:pointer;border:1.5px solid var(--border);background:#fff;color:var(--muted)}
.btn:hover{border-color:var(--low);color:var(--low)}
/* multi-select with checkboxes */
.ms{position:relative}
.msbtn{font-family:inherit;font-size:14px;padding:9px 11px;border:1.5px solid var(--border);
  border-radius:9px;background:#fff;color:var(--text);min-width:165px;width:100%;cursor:pointer;
  text-align:right;display:flex;align-items:center;gap:6px}
.msbtn:hover{border-color:var(--teal2)}
.msbtn.on{border-color:var(--teal);background:#eaf7f9;font-weight:600}
.msbtn .cnt{background:var(--teal);color:#fff;border-radius:999px;font-size:11px;font-weight:700;
  padding:1px 7px;margin-inline-start:auto}
.msbtn .arw{margin-inline-start:auto;color:var(--muted);font-size:11px}
.msbtn.on .arw{display:none}
.mspanel{position:absolute;top:calc(100% + 5px);inset-inline-start:0;z-index:30;background:#fff;
  border:1.5px solid var(--teal2);border-radius:11px;box-shadow:0 12px 34px rgba(0,0,0,.3);
  width:max(280px,100%);display:none;overflow:hidden}
.mspanel.on{display:block}
.mssearch{width:100%;font-family:inherit;font-size:13.5px;padding:9px 11px;border:0;
  border-bottom:1px solid var(--border);outline:none}
.msopts{max-height:290px;overflow-y:auto;padding:4px 0}
.msgrp{font-size:11px;font-weight:700;color:var(--muted);background:var(--light);
  padding:5px 11px;position:sticky;top:0}
.msopt{display:flex;align-items:center;gap:8px;padding:6px 11px;font-size:13.5px;cursor:pointer}
.msopt:hover{background:var(--light)}
.msopt input{width:16px;height:16px;accent-color:var(--teal);cursor:pointer;flex:0 0 auto}
.msopt .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msopt .n{color:var(--muted);font-size:11.5px}
.msfoot{display:flex;gap:8px;padding:8px 10px;border-top:1px solid var(--border);background:#fafdfe}
.msfoot button{flex:1;font-family:inherit;font-size:13px;font-weight:600;padding:6px;border-radius:7px;
  border:1.5px solid var(--border);background:#fff;color:var(--muted);cursor:pointer}
.msfoot button:hover{border-color:var(--teal2);color:var(--teal)}
.msnone{padding:14px 11px;font-size:13px;color:var(--muted);text-align:center}

.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}
.tag2{display:inline-flex;align-items:center;gap:6px;background:#eaf7f9;border:1.5px solid var(--teal2);
  color:var(--teal);border-radius:999px;padding:4px 11px;font-size:13px;font-weight:600;max-width:290px}
.tag2 .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag2 button{border:0;background:none;color:var(--teal);font-size:16px;line-height:1;cursor:pointer;padding:0}
.tag2 button:hover{color:var(--low)}

/* whatsapp */
.wa{display:inline-flex;align-items:center;gap:9px;margin-top:16px;background:#25D366;color:#fff;
  text-decoration:none;font-weight:700;font-size:15.5px;padding:12px 24px;border-radius:999px;
  box-shadow:0 6px 20px rgba(37,211,102,.35);transition:transform .12s,box-shadow .12s}
.wa:hover{transform:translateY(-2px);box-shadow:0 9px 26px rgba(37,211,102,.5)}
.wa svg{width:21px;height:21px;fill:currentColor;flex:0 0 auto}

/* prominent deals toggle */
.dealbtn{display:inline-flex;align-items:center;gap:7px;font-family:inherit;font-size:14px;
  font-weight:700;padding:9px 14px;border-radius:9px;cursor:pointer;margin-bottom:0;
  border:1.5px solid var(--orange);background:#fff8ee;color:#b26a00;white-space:nowrap;
  transition:.14s}
.dealbtn:hover{background:#ffeed6}
.dealbtn.on{background:var(--orange);color:#fff;box-shadow:0 5px 18px rgba(245,166,35,.45)}
.dealbtn .bx{width:16px;height:16px;border:2px solid currentColor;border-radius:4px;
  display:inline-flex;align-items:center;justify-content:center;font-size:12px;line-height:1;flex:0 0 auto}
.dealbtn .dn{background:rgba(178,106,0,.14);border-radius:999px;font-size:11.5px;
  font-weight:700;padding:1px 7px}
.dealbtn.on .dn{background:rgba(255,255,255,.28)}

.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;padding-top:13px;
  border-top:1px solid var(--border);font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:13px;height:13px;border-radius:3px;margin-inline-end:6px;vertical-align:-2px}

.count{color:#cfe3ea;font-size:14px;margin:0 4px 12px;font-weight:500}
.count b{color:var(--orange)}

.lst{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 10px 34px rgba(0,0,0,.28)}
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:820px}
thead th{background:#eaf4f7;padding:11px 10px;font-size:12px;font-weight:700;color:var(--muted);
  text-align:right;border-bottom:2px solid var(--border);position:sticky;top:0;z-index:2;white-space:nowrap}
tbody td{padding:10px;border-bottom:1px solid #e8f1f4;font-size:13.5px;vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:#f6fbfc}
.dt{direction:ltr;display:inline-block;font-weight:600;color:var(--navy);white-space:nowrap}
.bn{font-weight:700}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap}
.pill.ok{background:var(--ok)} .pill.mid{background:var(--mid)}
.pill.low{background:var(--low)} .pill.none{background:var(--none)}
.pr{font-weight:700;color:var(--text);direction:ltr;display:inline-block;white-space:nowrap}
.pr s{color:var(--muted);font-weight:400;font-size:12px;margin-inline-start:5px}
.off{display:inline-block;background:var(--orange);color:#fff;font-size:11px;font-weight:700;
  border-radius:5px;padding:1px 6px;margin-inline-start:5px}
.empty{padding:50px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;font-size:17px;color:var(--text);margin-bottom:6px}
.more{padding:14px;text-align:center;font-size:13px;color:var(--muted);background:var(--light)}

.ov{position:fixed;inset:0;background:rgba(6,22,32,.72);z-index:50;display:none;
  align-items:flex-start;justify-content:center;padding:26px 14px;overflow-y:auto}
.ov.on{display:flex}
.dlg{background:#fff;border-radius:16px;max-width:720px;width:100%;overflow:hidden;
  box-shadow:0 24px 60px rgba(0,0,0,.45)}
.dlg header{background:linear-gradient(135deg,var(--navy),var(--teal));color:#fff;padding:18px 20px;position:relative}
.dlg header h2{font-size:20px;font-weight:800;direction:ltr;text-align:right}
.dlg header p{font-size:13px;opacity:.9;margin-top:3px}
.x{position:absolute;inset-inline-start:14px;top:14px;width:32px;height:32px;border-radius:50%;
  border:0;background:rgba(255,255,255,.2);color:#fff;font-size:19px;cursor:pointer;line-height:1}
.x:hover{background:rgba(255,255,255,.34)}
.dbody{padding:18px 20px 22px;max-height:calc(100vh - 190px);overflow-y:auto}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:6px}
.kv div{background:var(--light);border-radius:9px;padding:9px 11px}
.kv span{display:block;font-size:11px;color:var(--muted);font-weight:600}
.kv b{font-size:15px;color:var(--text)}
.sec{margin-top:16px}
.sec h3{font-size:14px;font-weight:800;color:var(--navy);margin-bottom:8px;padding-bottom:5px;
  border-bottom:2px solid var(--light)}
.sec ul{list-style:none;display:flex;flex-wrap:wrap;gap:6px 10px}
.sec li{font-size:13.5px;padding-inline-start:16px;position:relative;line-height:1.5;flex:0 0 auto}
.sec li::before{content:'';position:absolute;inset-inline-start:0;top:8px;width:6px;height:6px;
  border-radius:50%;background:var(--teal2)}
.sec.no li::before{background:var(--low)}
.sec.part li::before{background:var(--orange)}
.sec.part h3{color:#b26a00}
.hint{font-size:12px;color:var(--muted);font-weight:400;margin-top:-4px;margin-bottom:7px}

.itbtn{display:block;width:100%;margin-top:14px;font-family:inherit;font-size:14px;font-weight:700;
  padding:11px;border-radius:10px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);cursor:pointer}
.itbtn:hover{background:var(--light)}
.itwrap{display:none;margin-top:12px;background:var(--light);border-radius:11px;padding:14px}
.itwrap.on{display:block}
.itwrap p{font-size:13.5px;line-height:1.75;white-space:pre-wrap;direction:ltr;text-align:left}
.itmeta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:11px}
.itmeta span{background:#fff;border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:12.5px}
.itmeta b{color:var(--navy)}

.bk{margin-top:20px;border-top:2px solid var(--light);padding-top:16px}
.bk h3{font-size:15px;font-weight:800;color:var(--navy);margin-bottom:4px}
.bk .sub{font-size:12.5px;color:var(--muted);margin-bottom:12px}
.bkgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bkgrid .full{grid-column:1 / -1}
.bk input,.bk textarea,.bk select{width:100%;font-family:inherit;font-size:14px;padding:10px 11px;
  border:1.5px solid var(--border);border-radius:9px;background:#fff;color:var(--text)}
.bk textarea{min-height:74px;resize:vertical}
.bk input:focus,.bk textarea:focus,.bk select:focus{outline:none;border-color:var(--teal2)}
.bk .gen{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.bk .gen select{width:auto;min-width:74px}
.bk .cablab{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.bk .nopay{text-align:center;font-size:13px;font-weight:600;color:var(--ok);margin:14px 0 10px}
.bksend{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  font-family:inherit;font-size:16px;font-weight:800;padding:14px;border-radius:11px;border:0;
  background:#25D366;color:#fff;cursor:pointer;text-decoration:none;
  box-shadow:0 5px 18px rgba(37,211,102,.35)}
.bksend:hover{filter:brightness(1.05)}
.bksend svg{width:20px;height:20px;fill:currentColor}
.sur{width:100%;border-collapse:collapse;font-size:13px;min-width:0}
.sur th{background:var(--light);padding:7px 9px;text-align:right;font-size:11.5px;color:var(--muted);
  border-bottom:1px solid var(--border)}
.sur td{padding:7px 9px;border-bottom:1px solid #eef5f7}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:1px 7px;white-space:nowrap}
.tag.b{background:#ffe9cc;color:#9a5b00}
.tag.l{background:#dceef7;color:#1B4F8A}
.tag.i{background:#d9f2e5;color:#1c6e48}

.foot{text-align:center;color:#8fb0bd;font-size:12.5px;margin-top:24px;line-height:1.9}
.foot b{color:#bcd7e0}

@media(max-width:760px){
  .fld{flex:1 1 145px}
  .fld select,.fld input[type=text]{min-width:0;width:100%}
  .fld.wide{flex:1 1 100%}
  .kv{grid-template-columns:1fr 1fr}
  .sec ul{flex-direction:column}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <h1>Liveaboard <span>Finder</span></h1>
    <p>כל הפלגות הצלילה. כל היעדים. במקום אחד.</p>
    <div class="stamp">
      <span>ספינות: <b id="sBoats">0</b></span>
      <span>הפלגות: <b id="sTrips">0</b></span>
      <span>יעדים: <b id="sDest">0</b></span>
    </div>
    <div>
      <a class="wa" id="waTop" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.47 14.38c-.3-.15-1.75-.86-2.02-.96-.27-.1-.47-.15-.67.15-.2.3-.77.96-.94 1.16-.17.2-.35.22-.64.07-.3-.15-1.25-.46-2.38-1.47-.88-.78-1.47-1.75-1.65-2.05-.17-.3-.02-.46.13-.6.13-.14.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.6-.92-2.2-.24-.57-.49-.5-.67-.5l-.57-.01c-.2 0-.52.07-.79.37-.27.3-1.04 1.01-1.04 2.47s1.06 2.86 1.21 3.06c.15.2 2.1 3.2 5.08 4.49.71.3 1.26.49 1.69.63.71.22 1.36.19 1.87.12.57-.09 1.75-.72 2-1.41.25-.69.25-1.28.17-1.41-.07-.13-.27-.2-.57-.35zM12.04 21.5h-.01a9.4 9.4 0 0 1-4.79-1.31l-.34-.2-3.56.93.95-3.47-.22-.36a9.38 9.38 0 0 1-1.44-5c0-5.18 4.22-9.4 9.41-9.4a9.35 9.35 0 0 1 6.65 2.76 9.32 9.32 0 0 1 2.75 6.65c0 5.18-4.22 9.4-9.4 9.4zM20.5 3.49A11.8 11.8 0 0 0 12.04 0C5.49 0 .16 5.33.16 11.88c0 2.09.55 4.14 1.59 5.94L.06 24l6.34-1.66a11.86 11.86 0 0 0 5.64 1.44h.01c6.55 0 11.88-5.33 11.88-11.88 0-3.17-1.24-6.15-3.48-8.4z"/></svg>
        התייעצו עם מומחה בווטסאפ</a>
    </div>
  </div>

  <div class="panel">
    <div class="controls">
      <div class="fld" id="msDest"></div>
      <div class="fld" id="msBoat"></div>
      <div class="fld" id="msItin"></div>
      <div class="fld" id="msNights"></div>
      <div class="fld">
        <label for="fFrom">מחודש</label>
        <select id="fFrom"></select>
      </div>
      <div class="fld">
        <label for="fTo">עד חודש</label>
        <select id="fTo"></select>
      </div>
      <div class="fld">
        <label for="fSort">מיון</label>
        <select id="fSort">
          <option value="date">תאריך</option>
          <option value="price">מחיר, מהזול</option>
          <option value="priced">מחיר, מהיקר</option>
          <option value="disc">גובה ההנחה</option>
          <option value="spots">מקומות פנויים</option>
        </select>
      </div>
      <div class="fld" style="flex:0 0 auto">
        <label for="fText">חיפוש חופשי</label>
        <input type="text" id="fText" placeholder="יעד, ספינה או מסלול" style="min-width:0;width:285px" />
      </div>
      <label class="tog"><input type="checkbox" id="fAvail" checked /> רק עם מקום פנוי</label>
      <button type="button" class="dealbtn" id="fDeal">
        <span class="bx" id="dealBx"></span> רק מבצעים <span class="dn" id="dealN"></span>
      </button>
      <button class="btn" id="clr">נקה סינון</button>
    </div>
    <div class="tags" id="tags"></div>
    <div class="legend">
      <span><i style="background:var(--ok)"></i>זמינות טובה</span>
      <span><i style="background:var(--mid)"></i>מתמלא</span>
      <span><i style="background:var(--low)"></i>מקומות אחרונים</span>
      <span><i style="background:var(--none)"></i>מלא</span>
      <span style="margin-inline-start:auto">לחצו על שורה לפרטים מלאים</span>
    </div>
  </div>

  <div class="count" id="count"></div>
  <div id="view"></div>

  <div class="foot">
    המחירים בדולר ארה"ב, לאדם, ואינם כוללים טיסות. זמינות ומחירים משתנים ויש לאמת לפני הזמנה.<br />
    <b>Buddy-Divers</b>, סוכנות הצלילה שלכם
  </div>
</div>

<div class="ov" id="ov"><div class="dlg">
  <header>
    <button class="x" id="xBtn" aria-label="סגור">&times;</button>
    <h2 id="dTitle"></h2>
    <p id="dSub"></p>
  </header>
  <div class="dbody" id="dBody"></div>

function tone(t) {
  if (!t.available || !t.spots) return 'none';
  if (!t.total_spots) return 'ok';
  const r = t.spots / t.total_spots;
  return r <= 0.25 ? 'low' : r <= 0.5 ? 'mid' : 'ok';
}
function usd(n) { return n == null ? '' : '$' + Math.round(n).toLocaleString('en-US'); }
function ltrDate(d) { return d.getDate() + ' ' + SHORT_MO[d.getMonth()] + ' ' + d.getFullYear(); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function heDest(d) { return DEST_HE[d] || d; }

/* `skip` lets a facet count its own options against every OTHER active filter,
   so the numbers next to each checkbox stay honest as you narrow things down. */
function filtered(skip) {
  const q = S.text.trim().toLowerCase();
  return ROWS.filter(t => {
    if (skip !== 'dest' && S.dest.size && !S.dest.has(t.boat.destination)) return false;
    if (skip !== 'boat' && S.boat.size && !S.boat.has(t.boat.slug)) return false;
    if (skip !== 'itin' && S.itin.size && !S.itin.has(t.itinerary)) return false;
    if (skip !== 'nights' && S.nights.size && !S.nights.has(t.nights)) return false;
    if (t.key < S.from || t.key > S.to) return false;
    if (S.avail && (!t.available || !t.spots)) return false;
    if (S.deal && !t.discount_pct) return false;
    if (q && t.boat.name.toLowerCase().indexOf(q) === -1
          && (t.itinerary || '').toLowerCase().indexOf(q) === -1
          && (t.from_port || '').toLowerCase().indexOf(q) === -1
          && t.boat.destination.toLowerCase().indexOf(q) === -1
          && heDest(t.boat.destination).indexOf(q) === -1) return false;
    return true;
  });
}

function tally(skip, keyFn) {
  const m = new Map();
  filtered(skip).forEach(t => {
    const k = keyFn(t);
    if (k === '' || k == null) return;
    m.set(k, (m.get(k) || 0) + 1);
  });
  return m;
}

/* ---------- multi-select widget ---------- */
function MultiSelect(mountId, opts) {
  const host = document.getElementById(mountId);
  host.classList.add('ms');
  host.innerHTML = '<label>' + opts.label + '</label>'
    + '<button type="button" class="msbtn"></button>'
    + '<div class="mspanel">'
    + (opts.search ? '<input class="mssearch" placeholder="סינון ברשימה" />' : '')
    + '<div class="msopts"></div>'
    + '<div class="msfoot"><button type="button" class="mclr">נקה</button>'
    + '<button type="button" class="mcls">סגור</button></div></div>';

  const btn = host.querySelector('.msbtn');
  const panel = host.querySelector('.mspanel');
  const box = host.querySelector('.msopts');
  const search = host.querySelector('.mssearch');
  let q = '';

  function paint() {
    const groups = opts.groups();      // [[groupLabel|null, [[value, label, count]]]]
    let h = '', shown = 0;
    groups.forEach(([g, items]) => {
      const vis = items.filter(([v, lab]) =>
        !q || String(lab).toLowerCase().indexOf(q) !== -1);
      if (!vis.length) return;
      if (g) h += '<div class="msgrp">' + esc(g) + '</div>';
      vis.forEach(([v, lab, n]) => {
        shown++;
        h += '<label class="msopt"><input type="checkbox" value="' + esc(v) + '"'
          + (opts.sel.has(v) ? ' checked' : '') + ' />'
          + '<span class="nm"' + (opts.ltr ? ' dir="ltr"' : '') + '>' + esc(lab) + '</span>'
          + '<span class="n">' + n + '</span></label>';
      });
    });
    box.innerHTML = shown ? h : '<div class="msnone">אין תוצאות</div>';
  }

  /* Once the panel is open the rows stay put: ticking a box must not reorder or
     drop the option under the cursor, or picking several in a row is impossible.
     Only the counts are refreshed in place. */
  function refreshCounts() {
    const m = new Map();
    opts.groups().forEach(([, items]) => items.forEach(([v, , n]) => m.set(String(v), n)));
    box.querySelectorAll('.msopt').forEach(row => {
      const cb = row.querySelector('input');
      const n = row.querySelector('.n');
      if (cb && n) n.textContent = m.get(cb.value) || 0;
    });
  }

  function label() {
    const n = opts.sel.size;
    btn.classList.toggle('on', n > 0);
    btn.innerHTML = n === 0
      ? esc(opts.empty) + '<span class="arw">&#9662;</span>'
      : esc(opts.label) + '<span class="cnt">' + n + '</span>';
  }

  btn.onclick = e => {
    e.stopPropagation();
    const wasOpen = panel.classList.contains('on');
    document.querySelectorAll('.mspanel.on').forEach(p => p.classList.remove('on'));
    if (!wasOpen) { paint(); panel.classList.add('on'); if (search) search.focus(); }
  };
  panel.onclick = e => e.stopPropagation();
  if (search) search.oninput = () => { q = search.value.trim().toLowerCase(); paint(); };
  box.onchange = e => {
    const cb = e.target;
    if (cb.type !== 'checkbox') return;
    const v = opts.parse ? opts.parse(cb.value) : cb.value;
    cb.checked ? opts.sel.add(v) : opts.sel.delete(v);
    opts.onChange();
  };
  host.querySelector('.mclr').onclick = () => {
    opts.sel.clear(); opts.onChange(); paint(); label();
  };
  host.querySelector('.mcls').onclick = () => panel.classList.remove('on');

  return {
    refresh: () => {
      label();
      if (panel.classList.contains('on')) refreshCounts();
    },
    close: () => panel.classList.remove('on')
  };
}

    + kv('מקומות', to === 'none' ? 'מלא' : t.spots + ' מתוך ' + (t.total_spots || '?'))
    + kv('מחיר לאדם בחדר זוגי', usd(t.price_now), 1)
    + (t.discount_pct ? kv('הנחה', t.discount_pct + '%, במקום ' + usd(t.price), 1) : '')
    + (t.from_port ? kv('נמל יציאה', t.from_port, 1) : '')
    + (t.to_port && t.to_port !== t.from_port ? kv('נמל חזרה', t.to_port, 1) : '')
    + '</div>';

  if (t.surcharges && t.surcharges.length) {
    h += '<div class="sec"><h3>תוספות חובה ותשלומים נוספים</h3><table class="sur">'
       + '<thead><tr><th>פריט</th><th>עלות</th><th>מתי משלמים</th></tr></thead><tbody>';
    t.surcharges.forEach(s => {
      const tag = s.in_price ? '<span class="tag i">כלול במחיר</span>'
                : s.with_booking ? '<span class="tag b">עם ההזמנה</span>'
                : s.on_location ? '<span class="tag l">במקום</span>' : '';
      h += '<tr><td>' + esc(s.name) + '</td>'
         + '<td><span dir="ltr">' + esc(s.price) + '</span></td><td>' + tag + '</td></tr>';
    });
    h += '</tbody></table></div>';
  }
  if (b.included && b.included.length) h += secList('כלול במחיר ההפלגה', b.included, '');
  if (b.excluded && b.excluded.length) h += secList('לא כלול, תוספת בתשלום', b.excluded, ' no');
  if (b.facilities && b.facilities.length) h += secList('ציוד ומתקנים על הספינה', b.facilities, '');

  /* itinerary detail, straight from the operator, untranslated.
     im = [descId, experience, dives, depPort, retPort]; the prose itself lives
     in the side file and is fetched the first time anyone asks for it. */
  const im = t.im;
  if (im && (im[0] >= 0 || im[1] || im[2])) {
    h += '<button type="button" class="itbtn" id="itBtn">פרטי המסלול המלאים</button>'
       + '<div class="itwrap" id="itWrap"><div class="itmeta">'
       + (im[3] ? '<span>יציאה: <b dir="ltr">' + esc(im[3]) + '</b></span>' : '')
       + (im[4] ? '<span>חזרה: <b dir="ltr">' + esc(im[4]) + '</b></span>' : '')
       + (im[2] ? '<span>צלילות: <b>' + im[2] + '</b></span>' : '')
       + (im[1] ? '<span>ניסיון נדרש: <b dir="ltr">' + esc(im[1]) + '</b></span>' : '')
       + '</div><p id="itText"></p></div>';
  }

  h += bookingForm(t);

  document.getElementById('dBody').innerHTML = h;
  const ib = document.getElementById('itBtn');
  if (ib) ib.onclick = () => {
    const w = document.getElementById('itWrap');
    w.classList.toggle('on');
    ib.textContent = w.classList.contains('on') ? 'סגירת פרטי המסלול' : 'פרטי המסלול המלאים';
    if (w.classList.contains('on')) showDesc(t.im ? t.im[0] : -1);
  };
  wireBooking(t);
  document.getElementById('ov').classList.add('on');
  document.body.style.overflow = 'hidden';
}
/* ---------- booking request, delivered over WhatsApp ---------- */
const WA_NUM = '972542323567';
const WA_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.47 14.38c-.3-.15-1.75-.86-2.02-.96-.27-.1-.47-.15-.67.15-.2.3-.77.96-.94 1.16-.17.2-.35.22-.64.07-.3-.15-1.25-.46-2.38-1.47-.88-.78-1.47-1.75-1.65-2.05-.17-.3-.02-.46.13-.6.13-.14.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.6-.92-2.2-.24-.57-.49-.5-.67-.5l-.57-.01c-.2 0-.52.07-.79.37-.27.3-1.04 1.01-1.04 2.47s1.06 2.86 1.21 3.06c.15.2 2.1 3.2 5.08 4.49.71.3 1.26.49 1.69.63.71.22 1.36.19 1.87.12.57-.09 1.75-.72 2-1.41.25-.69.25-1.28.17-1.41-.07-.13-.27-.2-.57-.35zM12.04 21.5h-.01a9.4 9.4 0 0 1-4.79-1.31l-.34-.2-3.56.93.95-3.47-.22-.36a9.38 9.38 0 0 1-1.44-5c0-5.18 4.22-9.4 9.41-9.4a9.35 9.35 0 0 1 6.65 2.76 9.32 9.32 0 0 1 2.75 6.65c0 5.18-4.22 9.4-9.4 9.4zM20.5 3.49A11.8 11.8 0 0 0 12.04 0C5.49 0 .16 5.33.16 11.88c0 2.09.55 4.14 1.59 5.94L.06 24l6.34-1.66a11.86 11.86 0 0 0 5.64 1.44h.01c6.55 0 11.88-5.33 11.88-11.88 0-3.17-1.24-6.15-3.48-8.4z"/></svg>';

function bookingForm(t) {
  const g = n => '<option value="' + n + '">' + n + '</option>';
  let sel = '';
  for (let i = 0; i <= 12; i++) sel += g(i);
  return '<div class="bk">'
    + '<h3>בקשת הזמנה להפלגה הזו</h3>'
    + '<div class="sub">מלאו מה שנוח לכם. הפרטים ייארזו להודעת ווטסאפ מוכנה, יחד עם פרטי ההפלגה.</div>'
    + '<div class="bkgrid">'
    + '<input type="text" id="bkFirst" placeholder="שם פרטי" />'
    + '<input type="text" id="bkLast" placeholder="שם משפחה" />'
    + '<input type="email" id="bkMail" placeholder="כתובת אימייל" />'
    + '<input type="tel" id="bkPhone" placeholder="מספר טלפון" />'
    + '<div class="full gen">הרכב האורחים:'
    + '<span>גברים</span><select id="bkM">' + sel + '</select>'
    + '<span>נשים</span><select id="bkF">' + sel + '</select></div>'
    + cabinPicker(t)
    + '<textarea class="full" id="bkNote" placeholder="העדפת מיטה או כל בקשה אחרת"></textarea>'
    + '</div>'
    + '<div class="nopay">לא נדרש תשלום כדי לשמור מקום</div>'
    + '<a class="bksend" id="bkSend" target="_blank" rel="noopener">' + WA_SVG
    + ' שליחת הבקשה בווטסאפ</a>'
    + '</div>';
}

function cabinPicker(t) {
  const list = t.boat.cabinTypes || [];
  if (!list.length) return '';
  return '<div class="full"><label class="cablab" for="bkCabin">בקשה לשדרוג תא</label>'
    + '<select id="bkCabin"><option value="">ללא העדפה</option>'
    + list.map(c => '<option value="' + esc(c) + '">' + esc(c) + '</option>').join('')
    + '</select></div>';
}

function wireBooking(t) {
  const a = document.getElementById('bkSend');
  if (!a) return;
  a.onclick = () => {
    const v = id => (document.getElementById(id).value || '').trim();
    const L = [];
    L.push('בקשת הזמנה מתוך Liveaboard Finder');
    L.push('');
    L.push('ההפלגה:');
    L.push('ספינה: ' + t.boat.name);
    L.push('יעד: ' + heDest(t.boat.destination));
    if (t.itinerary) L.push('מסלול: ' + t.itinerary);
    L.push('תאריך יציאה: ' + ltrDate(t.date));
    if (t.nights) L.push('משך: ' + t.nights + ' לילות');
    if (t.price_now) L.push('מחיר מוצג לאדם בחדר זוגי: ' + usd(t.price_now)
      + (t.discount_pct ? ' (' + t.discount_pct + '% הנחה)' : ''));
    if (t.spots) L.push('מקומות פנויים: ' + t.spots + (t.total_spots ? ' מתוך ' + t.total_spots : ''));

    /* only what was actually filled in */
    const who = [];
    if (v('bkFirst') || v('bkLast')) who.push('שם: ' + (v('bkFirst') + ' ' + v('bkLast')).trim());
    if (v('bkMail')) who.push('אימייל: ' + v('bkMail'));
    if (v('bkPhone')) who.push('טלפון: ' + v('bkPhone'));
    const m = +v('bkM'), f = +v('bkF');
    if (m || f) {
      const parts = [];
      if (m) parts.push(m === 1 ? 'גבר אחד' : m + ' גברים');
      if (f) parts.push(f === 1 ? 'אישה אחת' : f + ' נשים');
      who.push('אורחים: ' + parts.join(', '));
    }
    const cab = document.getElementById('bkCabin');
    if (cab && cab.value) who.push('בקשת שדרוג תא: ' + cab.value);
    if (v('bkNote')) who.push('הערות: ' + v('bkNote'));
    if (who.length) { L.push(''); L.push('הפרטים שלי:'); who.forEach(x => L.push(x)); }

    a.href = 'https://wa.me/' + WA_NUM + '?text=' + encodeURIComponent(L.join('\n'));
  };
}

/* ---------- itinerary prose, fetched once ---------- */
const DESC_URL = 'liveaboard-itineraries.json';
let DESCS = null, descPromise = null;

function loadDescs() {
  if (DESCS) return Promise.resolve(DESCS);
  if (!descPromise) {
    descPromise = fetch(DESC_URL)
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(j => (DESCS = j))
      .catch(e => { descPromise = null; throw e; });
  }
  return descPromise;
}

function showDesc(id) {
  const el = document.getElementById('itText');
  if (!el) return;
  if (id == null || id < 0) { el.textContent = ''; return; }
  if (DESCS) { el.textContent = DESCS[id] || ''; return; }
  el.textContent = 'טוען את תיאור המסלול...';
  loadDescs()
    .then(d => { el.textContent = d[id] || ''; })
    .catch(() => {
      el.textContent = location.protocol === 'file:'
        ? 'תיאור המסלול נטען מקובץ נלווה ולכן אינו זמין בפתיחה מקומית של הקובץ. באתר עצמו הוא יוצג כרגיל.'
        : 'לא הצלחנו לטעון את תיאור המסלול כרגע. שאר הפרטים מעודכנים.';
    });
}

function closeDlg() {
  document.getElementById('ov').classList.remove('on');
  document.body.style.overflow = '';
}

/* ---------- the four facets ---------- */
const BOAT_NAME = {};
BOATS.forEach(b => BOAT_NAME[b.slug] = b.name);

const MS = {};
MS.dest = MultiSelect('msDest', {
  label: 'יעד', empty: 'כל היעדים', sel: S.dest, search: true,
  onChange: render,
  groups: () => {
    const c = tally('dest', t => t.boat.destination), out = [], known = {};
    REGIONS.forEach(([region, pairs]) => {
      pairs.forEach(p => known[p[0]] = 1);
      const live = pairs.filter(p => c.get(p[0])).map(([en, he]) => [en, he, c.get(en)]);
      if (live.length) out.push([region, live]);
    });
    const rest = [...c.keys()].filter(d => !known[d]).sort()
      .map(d => [d, d, c.get(d)]);
    if (rest.length) out.push(['יעדים נוספים', rest]);
    return out;
  }
});
MS.boat = MultiSelect('msBoat', {
  label: 'ספינה', empty: 'כל הספינות', sel: S.boat, search: true, ltr: true,
  onChange: render,
  groups: () => {
    const c = tally('boat', t => t.boat.slug);
    const items = [...c.keys()]
      .sort((a, b) => BOAT_NAME[a].localeCompare(BOAT_NAME[b]))
      .map(s => [s, BOAT_NAME[s], c.get(s)]);
    return [[null, items]];
  }
});
MS.itin = MultiSelect('msItin', {
  label: 'מסלול', empty: 'כל המסלולים', sel: S.itin, search: true, ltr: true,
  onChange: render,
  groups: () => {
    const c = tally('itin', t => t.itinerary);
    const items = [...c.keys()].sort((a, b) => c.get(b) - c.get(a) || a.localeCompare(b))
      .map(i => [i, i, c.get(i)]);
    return [[null, items]];
  }
});
MS.nights = MultiSelect('msNights', {
  label: 'לילות', empty: 'מספר לילות', sel: S.nights, search: false,
  parse: v => +v,
  onChange: render,
  groups: () => {
    const c = tally('nights', t => t.nights);
    const items = [...c.keys()].sort((a, b) => a - b)
      .map(n => [n, n + ' לילות', c.get(n)]);
    return [[null, items]];
  }
});

function renderTags() {
  const bits = [];
  S.dest.forEach(v => bits.push(['dest', v, heDest(v)]));
  S.boat.forEach(v => bits.push(['boat', v, BOAT_NAME[v] || v]));
  S.itin.forEach(v => bits.push(['itin', v, v]));
  [...S.nights].sort((a, b) => a - b).forEach(v => bits.push(['nights', v, v + ' לילות']));
  document.getElementById('tags').innerHTML = bits.map(([k, v, lab]) =>
    '<span class="tag2"><span class="tx">' + esc(lab) + '</span>'
    + '<button type="button" data-k="' + k + '" data-v="' + esc(v) + '">&times;</button></span>'
  ).join('');
}
document.getElementById('tags').onclick = e => {
  const b = e.target.closest('button[data-k]');
  if (!b) return;
  const k = b.getAttribute('data-k');
  const raw = b.getAttribute('data-v');
  S[k].delete(k === 'nights' ? +raw : raw);
  render();
};

function render() {
  const rows = filtered();
  if (S.sort === 'price') rows.sort((a, b) => (a.price_now || 9e9) - (b.price_now || 9e9) || a.ts - b.ts);
  else if (S.sort === 'priced') rows.sort((a, b) => (b.price_now || 0) - (a.price_now || 0) || a.ts - b.ts);
  else if (S.sort === 'disc') rows.sort((a, b) => (b.discount_pct || 0) - (a.discount_pct || 0) || a.ts - b.ts);
  else if (S.sort === 'spots') rows.sort((a, b) => (b.spots || 0) - (a.spots || 0) || a.ts - b.ts);
  else rows.sort((a, b) => a.ts - b.ts);

  const nb = new Set(rows.map(r => r.boat.slug)).size;
  document.getElementById('count').innerHTML =
    '<b>' + rows.length + '</b> הפלגות על <b>' + nb + '</b> ספינות';

  document.getElementById('view').innerHTML = rows.length ? renderList(rows)
    : '<div class="lst"><div class="empty"><b>לא נמצאו הפלגות</b>'
      + 'נסו לשנות את הסינון או להרחיב את טווח החודשים.</div></div>';

  Object.keys(MS).forEach(k => MS[k].refresh());
  renderTags();

  const db = $('fDeal');
  db.classList.toggle('on', S.deal);
  $('dealBx').textContent = S.deal ? '\u2713' : '';
  const dealCount = S.deal ? rows.length
    : ROWS.filter(t => t.discount_pct && t.key >= S.from && t.key <= S.to
        && (!S.avail || (t.available && t.spots))).length;
  $('dealN').textContent = dealCount;
}

document.getElementById('waTop').href = 'https://wa.me/' + WA_NUM + '?text='
  + encodeURIComponent('שלום, ראיתי את לוח ההפלגות באתר ואשמח להתייעץ');

document.getElementById('sBoats').textContent = new Set(ROWS.map(t => t.boat.slug)).size;
document.getElementById('sTrips').textContent = ROWS.length;
document.getElementById('sDest').textContent = new Set(ROWS.map(t => t.boat.destination)).size;

buildMonths();
const $ = id => document.getElementById(id);
$('fFrom').onchange = e => { S.from = +e.target.value; if (S.to < S.from) { S.to = S.from; $('fTo').value = S.to; } render(); };
$('fTo').onchange = e => { S.to = +e.target.value; if (S.from > S.to) { S.from = S.to; $('fFrom').value = S.from; } render(); };
$('fSort').onchange = e => { S.sort = e.target.value; render(); };
$('fAvail').onchange = e => { S.avail = e.target.checked; render(); };
$('fDeal').onclick = () => { S.deal = !S.deal; render(); };
let tmr; $('fText').oninput = e => { clearTimeout(tmr); tmr = setTimeout(() => { S.text = e.target.value; render(); }, 200); };
$('clr').onclick = () => {
  S.dest.clear(); S.boat.clear(); S.itin.clear(); S.nights.clear();
  S.from = M0; S.to = M1; S.sort = 'date';
  S.text = ''; S.avail = true; S.deal = false;
  $('fFrom').value = M0; $('fTo').value = M1;
  $('fSort').value = 'date'; $('fText').value = '';
  $('fAvail').checked = true;
  Object.keys(MS).forEach(k => MS[k].close());
  render();
};
$('view').addEventListener('click', e => {
  const el = e.target.closest('[data-id]');
  if (el) openTrip(+el.getAttribute('data-id'));
});
$('xBtn').onclick = closeDlg;
$('ov').onclick = e => { if (e.target.id === 'ov') closeDlg(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDlg(); });

render();
</script>
